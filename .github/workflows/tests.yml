name: Translation workspace tests
on:
  push:
    branches: [main, import/v0.29]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run standard-library tests
        run: python -m unittest discover -s scripts -p 'test*.py' -v
